<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>ホームページ制作情報の入力｜Smart Labo</title>
<link rel="stylesheet" href="/assets/intake.css">
</head>
<body>

<!--
  ご案内リンクの入口。
  URL の # より後ろを一度だけ読み、すぐ消してから受付へ送る。
  ★この画面は、読み取った文字列を表示しない・保存しない・URLへ戻さない。
-->
<div class="solo">
  <div class="solo__card">
    <div class="solo__mark" aria-hidden="true"></div>

    <h1 class="solo__title" id="title">ホームページ制作情報の入力</h1>

    <p class="solo__text" id="message" role="status" aria-live="polite">
      準備しています。少しお待ちください。
    </p>

    <div class="solo__actions" id="actions" hidden></div>

    <noscript>
      <p class="solo__text">
        このフォームを利用するにはJavaScriptを有効にしてください。
      </p>
    </noscript>
  </div>
</div>

<script type="module" src="/assets/start.js"></script>
</body>
</html>
