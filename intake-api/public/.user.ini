; HP Intake API — 本番（XServer）で必須のPHP設定
; SSOT: docs/website/HP_ONBOARDING_INTAKE_DATA_MODEL_V1.md §10.4.1
;
; ★display_errors が ON だと、致命的エラーがレスポンス本文へ出力され、
;   絶対パス・SQL・設定値が露出する。経路によっては token / session secret が
;   トレースに載りうる。アプリ側の対策だけに依存しない。
; ★.user.ini は即時反映されない（user_ini.cache_ttl 既定300秒）。反映を待って確認する。
; ★error_log は必ず public_html の外を指すこと（配置時に実パスへ書き換える）。

display_errors         = Off
display_startup_errors = Off
log_errors             = On
; error_log = /home/<account>/<domain>/private/logs/php-error.log   ← 配置時に設定する

post_max_size          = 2M
upload_max_filesize    = 0
