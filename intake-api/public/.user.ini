; HP Intake API — 本番（XServer）で必須のPHP設定
; SSOT: docs/website/HP_ONBOARDING_INTAKE_DATA_MODEL_V1.md §10.4.1
;
; ★display_errors が ON だと、致命的エラーがレスポンス本文へ出力され、
;   絶対パス・SQL・設定値が露出する。経路によっては token / session secret が
;   トレースに載りうる。アプリ側の対策だけに依存しない。
; ★.user.ini は即時反映されない（user_ini.cache_ttl 既定300秒）。反映を待って確認する。
; ★error_log は必ず public_html の外を指すこと（配置時に実パスへ書き換える）。

display_errors         = Off
display_startup_errors = Off
log_errors             = On
; error_log = /home/<account>/<domain>/private/logs/php-error.log   ← 配置時に設定する

; ★expose_php（4F / P3-1）。既定 On のままだと `X-Powered-By: PHP/8.3.xx` が出て、
;   版まで含めて外部へ知らせてしまう。攻撃者に版固有の既知不具合を選ばせない。
;   ※`expose_php` は PHP_INI_SYSTEM である。共用サーバーでは .user.ini から
;     効かないことがある。**XServer 実機での効き確認は本番配置工程（4H）で行う。**
;     効かない場合は .htaccess の `Header always unset X-Powered-By` を併用する。
expose_php             = Off

; ★アップロードの抑止（HP-ONBOARDING-4H-3 で是正）。
;   SSOT §10.4.1 が必須としているのは display_errors / display_startup_errors /
;   log_errors / error_log / expose_php の5項目であり、以下の3行は**その要求ではない**。
;   SSOT §11.2-7「$_FILES を扱わない」を、設定側でも二重に担保するための上乗せである
;   （アプリ側は $_FILES・enctype・multipart のいずれも参照していない）。
;
; ★**`upload_max_filesize = 0` は「アップロード禁止」ではなく「上限なし」である。**
;   php-src (PHP-8.3) main/rfc1867.c の判定は
;     if (PG(upload_max_filesize) > 0 && (zend_long)(total_bytes+blen) > PG(upload_max_filesize))
;   であり、0 のときは左辺が偽になって**サイズ検査そのものが働かない**。
;   PHP 8.3.32 の実測でも、0 では 100KB のファイルが err=0 で受理された。
;   そのため 0 を使わず、1 以上の値を置く。
;
; ★実際にアップロードを止めるのは `max_file_uploads = 0` である。同ファイルの
;     } else if (upload_cnt <= 0) { skip_upload = 1; ... }
;   に該当し、**0バイトのファイルを含めて1件も受理されない**（実測で確認）。
;   通常の JSON / x-www-form-urlencoded の POST には影響しない（実測で確認）。
;
; ★`file_uploads = Off` は **PHP_INI_SYSTEM** のため `.user.ini` からは効かない
;   （expose_php と同じ事情）。ここでは使わない。
;
; ★post_max_size は Config::MAX_BODY_BYTES（1MB）より大きくすること。
;   正規の 1MB の body が PHP 側で捨てられないよう余裕を持たせる。
post_max_size          = 2M
upload_max_filesize    = 1
max_file_uploads       = 0
