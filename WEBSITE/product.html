<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================
     WEB-V3-4: 旧ページの転送用（Version 1 に存在した product.html）
     Version 3 では機能の説明を features.html へ統合したため、
     このURLへ来た訪問者と検索エンジンを features.html へ送る。

     GitHub Pages はサーバー側の301リダイレクトを設定できないため、
     静的ページで次の3つを同時に行う。
       ① canonical で正規URLを features.html と宣言する
       ② meta refresh（0秒）で即時転送する
       ③ JavaScript の location.replace で履歴を汚さず転送する
     いずれも無効な環境でも、本文のリンクから移動できるようにしている。

     このページは sitemap.xml へ載せない（正規URLは features.html）。
     ============================================================ -->

<title>ページの移動｜Smart Labo Works</title>
<meta name="description" content="このページは移動しました。Smart Labo Works の機能ページへご案内します。">
<link rel="canonical" href="https://smartlaboworks.com/features.html">
<meta http-equiv="refresh" content="0; url=features.html">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

<main id="main" class="section">
  <div class="container container--narrow">
    <h1>ページの場所が変わりました</h1>
    <p>
      このページの内容は、機能ページへ統合しました。
      自動で移動しない場合は、下のリンクからお進みください。
    </p>
    <p>
      <a href="features.html" class="btn btn--primary btn--lg">機能ページへ進む</a>
      <a href="index.html" class="btn btn--secondary btn--lg">トップページへ</a>
    </p>
  </div>
</main>

<script>
  // 履歴を汚さずに転送する（戻るボタンでこのページへ戻らない）
  location.replace('features.html');
</script>
</body>
</html>
